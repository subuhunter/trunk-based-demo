# Release: promote a tagged commit from the trunk to production.
#
# In trunk-based development you don't merge into a "production branch". You pick a
# commit that is already on `main`, give it a version tag, and deploy exactly that
# commit. Staging already ran it (Render deploys staging after CI passes on main).
#
# Trigger it with:  git tag v0.1.0 && git push origin v0.1.0
name: Release to production

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never run two production deploys at once, and never cancel one halfway.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  # Releases may only come from the trunk. A tag on some side branch is refused.
  on-trunk:
    name: tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so we can compare against main

      - name: Check the tagged commit is part of main
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is on main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on main. Release from the trunk only."
            exit 1
          fi

  # Run the same checks as CI one more time, on the exact commit we're shipping.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to production
    needs: [on-trunk, verify]
    runs-on: ubuntu-latest
    # The `production` GitHub environment holds the deploy hook secret, only allows
    # v* tags, and (if you enabled it) waits for your approval before this job runs.
    environment:
      name: production
      url: https://trunk-demo-prod.onrender.com
    steps:
      - name: Ask Render to deploy this exact commit
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set in the production environment."
            exit 1
          fi
          # The hook URL already contains ?key=..., so ref is appended with &.
          curl --fail-with-body --silent --show-error -X POST "${DEPLOY_HOOK}&ref=${GITHUB_SHA}"
          echo
          echo "Render is deploying ${GITHUB_SHA::7} (${GITHUB_REF_NAME}) to production."
